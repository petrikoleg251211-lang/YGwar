l_russian:
 YUG_organize_the_federation:0 "Организация работы федерального правительства"
 YUG_organize_the_federation_desc:0 "Выстроить рабочий порядок федерального кабинета, Президиума и республиканских делегаций, пока кризис не вынудил к спешке."
 YUG_strengthen_federal_institutions:0 "Укрепление федеральных институтов"
 YUG_strengthen_federal_institutions_desc:0 "Дать федеральным органам кадры и бюджет, чтобы их решения исполнялись."
 YUG_modernize_the_economy:0 "Модернизация экономики"
 YUG_modernize_the_economy_desc:0 "Открыть дискуссию о собственности, управлении предприятиями и роли рынка."
 YUG_reform_the_army:0 "Реформа армии"
 YUG_reform_the_army_desc:0 "Пересмотреть структуру Югославской народной армии и её отношения с республиками."
 YUG_defend_the_adriatic:0 "Оборона Адриатики"
 YUG_defend_the_adriatic_desc:0 "Обеспечить побережье, порты и прибрежные дороги, связывающие федерацию."
 YUG_yugoslav_future:0 "Будущее Югославии"
 YUG_yugoslav_future_desc:0 "Основа заложена. Теперь вопрос в том, какую Югославию примут республики."
 YUG_rising_nationalism:0 "Рост национализма"
 YUG_rising_nationalism_desc:0 "Национальные движения набирают силу во всех республиках, и общий язык политики перестаёт работать."
 YUG_crisis_of_federal_trust:0 "Кризис федерального доверия"
 YUG_crisis_of_federal_trust_desc:0 "Республики перестают верить, что федеральные органы говорят от их имени. Любое решение читают как услугу кому-то другому."
 YUG_emergency_republic_talks:0 "Чрезвычайные переговоры с республиками"
 YUG_emergency_republic_talks_desc:0 "Созвать республиканских лидеров на закрытое заседание. Ничего не решено, но все сидят в одной комнате."
 YUG_crackdown_on_separatism:0 "Подавление сепаратизма"
 YUG_crackdown_on_separatism_desc:0 "Рассматривать сепаратистские организации как угрозу конституционному порядку и действовать соответственно."
 YUG_constitutional_compromise_attempt:0 "Попытка конституционного компромисса"
 YUG_constitutional_compromise_attempt_desc:0 "Выложить на стол пакет: расширенные права республик, гарантированное федеральное ядро и график для обоих."
 YUG_allow_self_determination:0 "Признать самоопределение"
 YUG_allow_self_determination_desc:0 "Принять в принципе, что каждая республика вправе решать свою судьбу, и управлять тем, что последует."
 YUG_federal_collapse:0 "Крах федерации"
 YUG_federal_collapse_desc:0 "Федерация больше не может удерживать республики вместе по согласию. Остаётся решить, как всё закончится."
 YUG_republic_leaders_council:0 "Постоянный совет лидеров республик"
 YUG_republic_leaders_council_desc:0 "Постоянный орган, где президенты республик встречаются ежемесячно, с протоколами."
 YUG_administrative_reform:0 "Административная реформа"
 YUG_administrative_reform_desc:0 "Сократить дублирующие федеральные ведомства и поставить карьеру чиновников в зависимость от результата."
 YUG_review_competences:0 "Пересмотр разграничения полномочий"
 YUG_review_competences_desc:0 "Пройти по каждому федеральному полномочию и спросить, не справятся ли республики лучше."
 YUG_provinces_settlement:0 "Урегулирование с автономными краями"
 YUG_provinces_settlement_desc:0 "Уточнить положение Воеводины и Косова в федерации и в составе Сербии."
 YUG_new_federal_treaty:0 "Новый федеральный договор"
 YUG_new_federal_treaty_desc:0 "Заменить лоскутное одеяло поправок единым договором, который подпишут все республики."
 YUG_constitutional_settlement:0 "Конституционное урегулирование"
 YUG_constitutional_settlement_desc:0 "Ратифицировать реформированную конституцию и закрыть кризис по согласию."
 YUG_currency_stabilization:0 "Стабилизация валюты"
 YUG_currency_stabilization_desc:0 "Привязать динар к твёрдому якорю и защищать его резервами."
 YUG_fight_inflation:0 "Борьба с инфляцией"
 YUG_fight_inflation_desc:0 "Сдерживание зарплат, жёсткий бюджетный лимит и контроль цен. Непопулярно, но работает."
 YUG_banking_reform:0 "Реформа банковской системы"
 YUG_banking_reform_desc:0 "Отделить коммерческие банки от республиканского патронажа и ввести общие правила резервирования."
 YUG_industrial_stimulus:0 "Стимулирование промышленности"
 YUG_industrial_stimulus_desc:0 "Кредитные линии для машиностроения, металлургии и автомобилестроения в главных промышленных районах."
 YUG_energy_modernization:0 "Модернизация энергетики"
 YUG_energy_modernization_desc:0 "Перестроить энергосеть и объединить республиканские системы в одну."
 YUG_transport_programme:0 "Программа железных и автомобильных дорог"
 YUG_transport_programme_desc:0 "Достроить автомагистраль и модернизировать главные железные дороги между республиками."
 YUG_agriculture_modernization:0 "Модернизация сельского хозяйства"
 YUG_agriculture_modernization_desc:0 "Кооперативы, техника и хранилища, чтобы урожай не зависел только от погоды."
 YUG_adriatic_tourism:0 "Туризм на Адриатике"
 YUG_adriatic_tourism_desc:0 "Отели, гавани и единое туристическое ведомство для побережья."
 YUG_economic_equalization:0 "Программа экономического выравнивания"
 YUG_economic_equalization_desc:0 "Федеральный фонд для бедных республик. Богатые замечают счёт."
 YUG_export_led_strategy:0 "Экспортная стратегия"
 YUG_export_led_strategy_desc:0 "Ставка на внешние рынки: рост быстрее, зависимость от внешних потрясений сильнее."
 YUG_internal_market_strategy:0 "Стратегия внутреннего рынка"
 YUG_internal_market_strategy_desc:0 "Связать республиканские экономики общим рынком и общими цепочками поставок."
 YUG_reform_the_constitution:0 "Открыть конституционный вопрос"
 YUG_reform_the_constitution_desc:0 "Признать, что конституцию 1974 года нужно переписывать, и запустить процесс."
 YUG_political_liberalization:0 "Политическая либерализация"
 YUG_political_liberalization_desc:0 "Ослабить цензуру, разрешить независимые объединения и открыть парламентские дебаты."
 YUG_electoral_law_review:0 "Пересмотр избирательного закона"
 YUG_electoral_law_review_desc:0 "Подготовить правила конкурентных выборов, приемлемые для каждой республики."
 YUG_judicial_reform:0 "Судебная реформа"
 YUG_judicial_reform_desc:0 "Суды, защищённые от партийных указаний и республиканского давления."
 YUG_civil_liberties:0 "Защита гражданских свобод"
 YUG_civil_liberties_desc:0 "Свобода собраний, печати и объединений, закреплённая в федеральном законе."
 YUG_competitive_elections:0 "Конкурентные выборы"
 YUG_competitive_elections_desc:0 "Провести многопартийные выборы в федеральные и республиканские собрания."
 YUG_civilian_control_of_army:0 "Гражданский контроль над армией"
 YUG_civilian_control_of_army_desc:0 "Поставить армию под парламентский бюджетный контроль. Офицерский корпус принимает это к сведению."
 YUG_democratic_social_compact:0 "Новый демократический договор"
 YUG_democratic_social_compact_desc:0 "Договор между избранными правительствами вместо договора между партийными руководствами."
 YUG_division_of_powers:0 "Разделение полномочий"
 YUG_division_of_powers_desc:0 "Письменный перечень того, что принадлежит федерации, а что республикам."
 YUG_budget_autonomy_talks:0 "Переговоры о бюджетной самостоятельности"
 YUG_budget_autonomy_talks_desc:0 "Договориться, какая часть доходов каждой республики остаётся дома."
 YUG_joint_defence_treaty:0 "Договор о совместной обороне"
 YUG_joint_defence_treaty_desc:0 "Республиканские силы и федеральная армия принимают общий оборонный план."
 YUG_confederal_model:0 "Переход к конфедеративной модели"
 YUG_confederal_model_desc:0 "Суверенные республики делегируют общему центру отдельные полномочия."
 YUG_peaceful_exit_terms:0 "Условия мирного выхода"
 YUG_peaceful_exit_terms_desc:0 "Записать, как республика может выйти: референдум, долги, имущество армии, гражданство."
 YUG_economic_defence_union:0 "Экономический и оборонный союз"
 YUG_economic_defence_union_desc:0 "Сохранить единый рынок и единую оборону, даже если республики суверенны."
 YUG_security_forces_reform:0 "Реформа силовых структур"
 YUG_security_forces_reform_desc:0 "Свести пересекающиеся федеральные полицейские и спецслужбы под единое командование."
 YUG_disarm_illegal_formations:0 "Разоружение незаконных формирований"
 YUG_disarm_illegal_formations_desc:0 "Изъять оружие у неразрешённых местных вооружённых групп, пока они не организовались."
 YUG_centralize_defence_planning:0 "Централизация оборонного планирования"
 YUG_centralize_defence_planning_desc:0 "Все оборонные планы, склады и списки призыва подчиняются одному генеральному штабу."
 YUG_federal_administrative_control:0 "Федеральный административный контроль"
 YUG_federal_administrative_control_desc:0 "Назначить федеральных комиссаров для надзора за республиканскими администрациями."
 YUG_unity_campaign:0 "Кампания за единство"
 YUG_unity_campaign_desc:0 "Политическая кампания за общее государство: от школ до заводских цехов."
 YUG_federal_army_rearmament:0 "Перевооружение федеральной армии"
 YUG_federal_army_rearmament_desc:0 "Новая техника для частей, которым федерация доверяет больше всего."
 YUG_final_settlement_attempt:0 "Попытка окончательного урегулирования"
 YUG_final_settlement_attempt_desc:0 "Задействовать все федеральные рычаги сразу, чтобы закончить кризис на условиях центра."
 YUG_reform_socialist_institutions:0 "Реформа социалистических институтов"
 YUG_reform_socialist_institutions_desc:0 "Обновить партийные и государственные органы и вернуть их к программе самоуправления."
 YUG_workers_organizations:0 "Восстановление рабочих организаций"
 YUG_workers_organizations_desc:0 "Выборные рабочие советы с реальным голосом в вопросах зарплат и инвестиций."
 YUG_state_enterprise_modernization:0 "Модернизация госпредприятий"
 YUG_state_enterprise_modernization_desc:0 "Заменить изношенное оборудование в государственном секторе, прежде чем его закрывать."
 YUG_social_security:0 "Обновление социального обеспечения"
 YUG_social_security_desc:0 "Пенсии, здравоохранение и жильё, финансируемые по единой федеральной формуле."
 YUG_employment_programme:0 "Программа занятости"
 YUG_employment_programme_desc:0 "Общественные работы и переобучение для регионов, теряющих заводы."
 YUG_workers_state_compact:0 "Соглашение рабочих и государства"
 YUG_workers_state_compact_desc:0 "Новое соглашение между рабочими организациями, предприятиями и государством."
 YUG_modernize_ground_forces:0 "Модернизация сухопутных войск"
 YUG_modernize_ground_forces_desc:0 "План модернизации пехотного ядра армии."
 YUG_armoured_units:0 "Развитие бронетанковых частей"
 YUG_armoured_units_desc:0 "Сосредоточить танки в нескольких хорошо снабжаемых соединениях."
 YUG_artillery_modernization:0 "Модернизация артиллерии"
 YUG_artillery_modernization_desc:0 "Управление огнём, тяга и запасы снарядов."
 YUG_reservist_training:0 "Подготовка резервистов"
 YUG_reservist_training_desc:0 "Регулярные курсы переподготовки для мобилизационного резерва."
 YUG_territorial_defence_coordination:0 "Координация территориальной обороны"
 YUG_territorial_defence_coordination_desc:0 "Договориться, как республиканская территориальная оборона вписывается в федеральный план. Каждая республика держит свои склады."
 YUG_military_industry_programme:0 "Программа военной промышленности"
 YUG_military_industry_programme_desc:0 "Расширить арсенальные районы и обеспечить поставки комплектующих."
 YUG_civilian_oversight_of_army:0 "Гражданский надзор над армией"
 YUG_civilian_oversight_of_army_desc:0 "Создать оборонный комитет делегатов с бюджетными полномочиями."
 YUG_crisis_contingency_planning:0 "Планирование на случай кризиса государства"
 YUG_crisis_contingency_planning_desc:0 "Планы для каждого сценария кризиса, хранящиеся в сейфе генерального штаба."
 YGwar.10.t:0 "Трещины в федерации"
 YGwar.10.d:0 "Республиканские делегации всё чаще голосуют против федеральных предложений, а пресса начала считать голоса по республикам. Пока ничего не сломано, но все следят за реакцией Президиума."
 YGwar.10.a:0 "Собрать лидеров республик"
 YGwar.10.b:0 "Считать это обычной политикой"
 YGwar.11.t:0 "Кризис федерального доверия"
 YGwar.11.d:0 "Республики больше не принимают федеральные данные на веру. Бюджетные распределения, назначения в армии и даже цифры переписи оспариваются."
 YGwar.11.a:0 "Начать чрезвычайные переговоры"
 YGwar.11.b:0 "Подтвердить власть федерального центра"
 YGwar.12.t:0 "Чрезвычайная федеральная конференция"
 YGwar.12.d:0 "Согласованность федерации упала ниже уровня, при котором решения принимаются по согласию. Президиум созывает конференцию. Открыты три дороги, и ни одна не дешёвая."
 YGwar.12.a:0 "Искать конфедеративный компромисс"
 YGwar.12.b:0 "Ввести чрезвычайное управление"
 YGwar.12.c:0 "Готовиться к упорядоченному роспуску"
 YGwar.14.t:0 "Республики согласились на конфедеративную модель"
 YGwar.14.d:0 "Республики принимают проект конфедерации: суверенные члены, небольшой общий центр, единый рынок и совместный совет обороны. Это меньше, чем хотели одни, и больше, чем ожидали другие."
 YGwar.14.a:0 "Подписать проект"
 YGwar.14.b:0 "Подписать, с гарантированным армейским бюджетом"
 YGwar.15.t:0 "Силовые структуры смыкают ряды"
 YGwar.15.d:0 "Командиры нескольких гарнизонов стали принимать приказы только от офицеров своей республики. В штабных докладах это называют административным вопросом."
 YGwar.15.a:0 "Дать гарантии по жалованью и званиям"
 YGwar.15.b:0 "Провести ротацию командиров"
 YGwar.16.t:0 "Военное командование игнорирует правительство"
 YGwar.16.d:0 "Генштаб отказывается выполнить распоряжение кабинета, ссылаясь на состояние частей. Впервые за десятилетия армия выступает как политический субъект."
 YGwar.16.a:0 "Договориться с генералами"
 YGwar.16.b:0 "Передать армии чрезвычайные полномочия"
 YGwar.20.t:0 "Соглашение об упорядоченном роспуске"
 YGwar.20.d:0 "Словения, Хорватия и Македония признаются независимыми государствами по письменному соглашению. Долги, армейское имущество и пограничные переходы разделены на бумаге."
 YGwar.20.a:0 "Подписать соглашение"
 YGwar.21.t:0 "Босния и Герцеговина голосует"
 YGwar.21.d:0 "Боснии и Герцеговине теперь предстоит выбор. Три общины расходятся во мнениях, оставаться ли в том, что осталось от федерации, или выйти из неё."
 YGwar.21.a:0 "Допустить согласованный выход всей Боснии и Герцеговины"
 YGwar.21.b:0 "Требовать гарантий для каждой общины"
 YGwar.22.t:0 "Остаточная федерация реорганизуется"
 YGwar.22.d:0 "От федерации остались Сербия с краями и Черногория. Обоим правительствам предстоит решить, как устроить их союз и что делать с краями."
 YGwar.22.a:0 "Сохранить союз Сербии и Черногории с краями"
 YGwar.22.b:0 "Позволить Воеводине и Косову идти своим путём"
 YGwar.22.c:0 "Позволить Черногории выйти из союза"
 YGwar.30.t:0 "Конец федерации"
 YGwar.30.d:0 "Республики больше не согласны ни в чём, кроме даты последнего заседания. Президиум должен решить, как закончится государство."
 YGwar.30.a:0 "Упорядоченный роспуск по соглашению"
 YGwar.30.b:0 "Роспуск без соглашения"
 YGwar.30.c:0 "Удержать федерацию ещё ненадолго"
 YGwar.31.t:0 "Босния и Герцеговина расколота"
 YGwar.31.d:0 "Когда Хорватия воюет, а её сербские районы восстали, Боснию и Герцеговину растаскивают в разные стороны. Три общины создают собственные администрации."
 YGwar.31.a:0 "Три общины расходятся"
 YGwar.40.t:0 "Окончательное урегулирование"
 YGwar.40.d:0 "Федеральные силы, комиссары и кампания за единство действуют одновременно. Исход зависит от того, выполнят ли приказы силовые структуры."
 YGwar.40.a:0 "Провести урегулирование"
 YGwar.50.t:0 "Реформированная федерация"
 YGwar.50.d:0 "Республики ратифицируют конституцию, к написанию которой приложили руку все. Она не прекращает все споры, но даёт место, где их можно решить."
 YGwar.50.a:0 "Закрыть кризис по согласию"
 YGwar.51.t:0 "Новый демократический договор"
 YGwar.51.d:0 "Избранные правительства подписывают договор, оставляющий федерации меньшую, но лучше определённую роль."
 YGwar.51.a:0 "Сохранить демократическую федерацию"
 YGwar.51.b:0 "Остановиться на демократической конфедерации"
 YGwar.52.t:0 "Экономический и оборонный союз"
 YGwar.52.d:0 "Суверенные республики подписывают договор о союзе. Единый рынок, единый оборонный совет и постоянное право пересматривать членство."
 YGwar.52.a:0 "Ратифицировать союз"
 YGwar.53.t:0 "Соглашение рабочих и государства"
 YGwar.53.d:0 "Рабочие организации, предприятия и государство подписывают долгосрочное соглашение о зарплатах, инвестициях и самоуправлении."
 YGwar.53.a:0 "Подписать соглашение"
 YGwar.54.t:0 "Результаты выборов"
 YGwar.54.d:0 "Первые конкурентные выборы позади. Реформистский список и консервативно-компромиссная коалиция оба претендуют на право сформировать правительство."
 YGwar.54.a:0 "Реформистский список формирует правительство"
 YGwar.54.b:0 "Формируется компромиссная коалиция"
 YGwar.1.t:0 "Волнения в силовых структурах"
 YGwar.1.d:0 "В Президиум поступают сообщения о беспорядках в местных частях ополчения: невыплаченное жалованье, оспариваемые приказы и несанкционированные перемещения."
 YGwar.1.a:0 "Выплатить задолженность и успокоить части"
 YGwar.1.b:0 "Приказать частям вернуться в казармы"
 YUG_federal_bureaucracy:0 "Федеральная бюрократия"
 YUG_federal_bureaucracy_desc:0 "Дублирующие федеральные ведомства замедляют любое решение."
 YUG_streamlined_administration:0 "Упорядоченная администрация"
 YUG_streamlined_administration_desc:0 "Чёткие линии ответственности заменили прежнее дублирование."
 YUG_economic_instability:0 "Экономическая нестабильность"
 YUG_economic_instability_desc:0 "Инфляция и долги давят на заводы и домохозяйства."
 YUG_stabilization_programme:0 "Программа стабилизации"
 YUG_stabilization_programme_desc:0 "Жёсткие бюджетные лимиты стабилизировали цены ценой выпуска."
 YUG_republican_particularism:0 "Республиканский партикуляризм"
 YUG_republican_particularism_desc:0 "Каждая республика читает федеральную политику через свои интересы."
 YUG_military_leadership_influence:0 "Влияние военного руководства"
 YUG_military_leadership_influence_desc:0 "Армия сильна и имеет мнение о политике."
 YUG_transport_network:0 "Транспортная сеть"
 YUG_transport_network_desc:0 "Дороги, железные дороги и порты связывают республики лучше, чем политика."
 YUG_industrial_potential:0 "Промышленный потенциал"
 YUG_industrial_potential_desc:0 "Широкая база машиностроения, металлургии и автомобилестроения."
 YUG_federal_trust_crisis:0 "Кризис федерального доверия"
 YUG_federal_trust_crisis_desc:0 "Республики сомневаются в беспристрастности федеральных органов. Восстановите доверие или реформируйте федерацию, чтобы его снять."
 YUG_emergency_rule:0 "Чрезвычайное управление"
 YUG_emergency_rule_desc:0 "Решения принимаются быстро и немногими. Республики это замечают."
 YUG_rail_road_programme:0 "Программа железных и автомобильных дорог"
 YUG_rail_road_programme_desc:0 "Новые связи ускоряют перевозку грузов и войск."
 YUG_modern_agriculture:0 "Современное сельское хозяйство"
 YUG_modern_agriculture_desc:0 "Кооперативы и хранилища стабилизируют снабжение продовольствием."
 YUG_export_orientation:0 "Экспортная ориентация"
 YUG_export_orientation_desc:0 "Заводы работают на внешние рынки, со всеми вытекающими рисками."
 YUG_common_market:0 "Общий рынок"
 YUG_common_market_desc:0 "Общие цепочки поставок связывают республиканские экономики."
 YUG_democratic_institutions:0 "Демократические институты"
 YUG_democratic_institutions_desc:0 "Открытая политика приносит стабильность и замедляет решения."
 YUG_joint_defence:0 "Совместная оборона"
 YUG_joint_defence_desc:0 "Республиканские и федеральные силы делят один оборонный план."
 YUG_central_defence_planning:0 "Централизованное оборонное планирование"
 YUG_central_defence_planning_desc:0 "Один генеральный штаб управляет планами, складами и призывом."
 YUG_workers_councils:0 "Рабочие советы"
 YUG_workers_councils_desc:0 "Выборные советы имеют реальный голос в решениях предприятий."
 YUG_trained_reserves:0 "Подготовленные резервы"
 YUG_trained_reserves_desc:0 "Регулярная переподготовка держит мобилизационный резерв в готовности."
 YUG_territorial_defence_network:0 "Сеть территориальной обороны"
 YUG_territorial_defence_network_desc:0 "Местные склады и планы усиливают оборону, а вместе с ней и местные лояльности."
 YUG_confederal_bargaining:0 "Конфедеративный торг"
 YUG_confederal_bargaining_desc:0 "Каждое решение согласуется между суверенными членами."
 YUG_reformed_federation:0 "Реформированная федерация"
 YUG_reformed_federation_desc:0 "Конституция, к написанию которой приложили руку все республики."
 YUG_centralized_state:0 "Централизованное государство"
 YUG_centralized_state_desc:0 "Сильный центр, сильная армия и мало терпения к несогласию."
 YGwar_militia_category:0 "Силовые структуры"
 YGwar_federal_category:0 "Федеральное правительство"
 YGwar_federal_category_desc:0 "Повседневные инструменты федерального правительства."
 YGwar_crisis_category:0 "Федерация в кризисе"
 YGwar_crisis_category_desc:0 "Инструменты управления кризисом. Доступны, когда согласованность начала падать."
 YGwar_republic_category:0 "Республиканское правительство"
 YGwar_republic_category_desc:0 "Повседневные инструменты республиканских и региональных правительств."
 YUG_discipline_militia:0 "Дисциплинировать ополчение"
 YUG_discipline_militia_desc:0 "Повысить лояльность ополчения. Это может вызвать недовольство."
 YUG_hold_republic_talks:0 "Провести переговоры с республиками"
 YUG_hold_republic_talks_desc:0 "Повысить согласованность федерации."
 YUG_federal_economic_programme:0 "Федеральная экономическая программа"
 YUG_federal_economic_programme_desc:0 "Финансировать гражданскую промышленность, пока экономика нестабильна."
 YUG_constitutional_commission:0 "Комиссия по конституционной реформе"
 YUG_constitutional_commission_desc:0 "Создать комиссию, один раз. Повышает согласованность."
 YUG_review_budget_agreements:0 "Пересмотреть бюджетные договорённости"
 YUG_review_budget_agreements_desc:0 "Повысить согласованность за счёт недовольства силовых структур."
 YUG_army_development_programme:0 "Программа развития армии"
 YUG_army_development_programme_desc:0 "Построить оружейные заводы и повысить лояльность силовых структур."
 YUG_defuse_tensions:0 "Снизить напряжённость"
 YUG_defuse_tensions_desc:0 "Повысить согласованность."
 YUG_summon_emergency_talks:0 "Созвать чрезвычайные переговоры"
 YUG_summon_emergency_talks_desc:0 "Заметно повысить согласованность. Требует серьёзного кризиса."
 YUG_rebuild_trust:0 "Восстановить доверие"
 YUG_rebuild_trust_desc:0 "Повысить лояльность и согласованность, пока длится кризис доверия."
 YUG_prepare_transitional_administration:0 "Подготовить переходное управление"
 YUG_prepare_transitional_administration_desc:0 "Подготовиться к упорядоченному концу, один раз. Делает роспуск дешевле и безопаснее."
 YGwar_consolidate_institutions:0 "Укрепить институты"
 YGwar_consolidate_institutions_desc:0 "Повысить стабильность. Число применений ограничено."
 YGwar_regional_investment:0 "Региональные инвестиции"
 YGwar_regional_investment_desc:0 "Построить гражданскую промышленность. Число применений ограничено."
 YGwar_territorial_defence_drive:0 "Кампания территориальной обороны"
 YGwar_territorial_defence_drive_desc:0 "Повысить поддержку войны ценой некоторой стабильности. Число применений ограничено."
