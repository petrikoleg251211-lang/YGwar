 RSB_secure_the_economy_desc:0 "Сохранить работу банков, выплату зарплат и наполненность магазинов."
 RSB_repair_infrastructure:0 "Восстановление инфраструктуры"
 RSB_repair_infrastructure_desc:0 "Починить дороги, железные дороги и линии электропередач, которые прежняя федеральная система оставила недоделанными."
 RSB_revive_industry:0 "Возрождение промышленности"
 RSB_revive_industry_desc:0 "Заново связать заводы с сырьём и покупателями, которые раньше находились в других республиках."
 RSB_open_trade_routes:0 "Открытие торговых путей"
 RSB_open_trade_routes_desc:0 "Заменить федеральный рынок договорами, работающими через новые границы."
 RSB_national_economy:0 "Национальная экономика"
 RSB_national_economy_desc:0 "Построить экономику, опирающуюся на собственную валюту, собственный бюджет и собственные планы."
 RSB_u1:0 "Армия республики"
 RSB_u1_desc:0 "Создать единую армию из местных частей и бывших федеральных офицеров."
 RSB_u2:0 "Северный коридор"
 RSB_u2_desc:0 "Обеспечить дорожные и железнодорожные связи между западной и восточной частями территории."
 RSB_u3:0 "Связи с Сербией"
 RSB_u3_desc:0 "Выстроить экономические и политические связи с соседней Сербией."
 RSB_u4:0 "Сербская республика в Боснии"
 RSB_u4_desc:0 "У образования есть институты, армия и определённая территория в Боснии и Герцеговине."
 RSB_statehood_spirit:0 "Дух государственности"
 RSB_statehood_spirit_desc:0 "Первые месяцы работы собственных институтов дают стране ощущение цели."
 RSB_territorial_defence_spirit:0 "Территориальная оборона"
 RSB_territorial_defence_spirit_desc:0 "Резервные части в каждой общине затрудняют вторжение в страну."
 RSB_national_economy_spirit:0 "Национальная экономика"
 RSB_national_economy_spirit_desc:0 "Экономика теперь работает на собственном бюджете и по собственным планам."
 RSB_national_resolve:0 "Национальная решимость"
 RSB_national_resolve_desc:0 "Оборона, экономика и дипломатия поддерживают друг друга."
 RSK_consolidate_statehood:0 "Укрепление государственности"
 RSK_consolidate_statehood_desc:0 "Наладить работу институтов нового государства: правительство, бюджет, полицию и почту."
 RSK_build_defence_forces:0 "Создание сил обороны"
 RSK_build_defence_forces_desc:0 "Свести местные отряды и добровольцев в единую систему командования."
 RSK_territorial_defence:0 "Территориальная оборона"
 RSK_territorial_defence_desc:0 "Создать резервные части в каждой общине, чтобы государство не осталось беззащитным в первый же день."
 RSK_arms_procurement:0 "Закупка вооружений"
 RSK_arms_procurement_desc:0 "Принять местные склады и найти поставщиков, готовых продавать оружие новому государству."
 RSK_border_fortification:0 "Укрепление границ"
 RSK_border_fortification_desc:0 "Укрепить дороги, мосты и перевалы, которые решают, кто может войти в страну."
 RSK_professional_army:0 "Профессиональная армия"
 RSK_professional_army_desc:0 "Заменить импровизированные формирования обученными, оплачиваемыми и снабжаемыми бригадами."
 RSK_seek_recognition:0 "Поиск признания"
 RSK_seek_recognition_desc:0 "Добиться признания у соседей и в столицах, от которых это зависит."
 RSK_write_constitution:0 "Новая конституция"
