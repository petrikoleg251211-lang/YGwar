 BOS_u1:0 "Оборона каждой общины"
 BOS_u1_desc:0 "Страна слишком смешанная, чтобы обороняться из одного центра. Местные штабы должны держаться самостоятельно до подхода подкреплений."
 BOS_u2:0 "Сараевский коридор"
 BOS_u2_desc:0 "Сохранить открытыми дороги, железную дорогу и аэропорт, чтобы столица оставалась связанной с остальной страной."
 BOS_u3:0 "Общие институты"
 BOS_u3_desc:0 "Создать общие институты, в которых смогут участвовать и боснийцы, и сербы, и хорваты."
 BOS_u4:0 "Единая Босния"
 BOS_u4_desc:0 "Единое государство, включающее все его общины, с правительством, которое признают все."
