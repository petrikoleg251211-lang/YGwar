l_russian:
 SVN_consolidate_statehood:0 "Укрепление государственности"
 SVN_consolidate_statehood_desc:0 "Наладить работу институтов нового государства: правительство, бюджет, полицию и почту."
 SVN_build_defence_forces:0 "Создание сил обороны"
 SVN_build_defence_forces_desc:0 "Свести местные отряды и добровольцев в единую систему командования."
 SVN_territorial_defence:0 "Территориальная оборона"
 SVN_territorial_defence_desc:0 "Создать резервные части в каждой общине, чтобы государство не осталось беззащитным в первый же день."
 SVN_arms_procurement:0 "Закупка вооружений"
 SVN_arms_procurement_desc:0 "Принять местные склады и найти поставщиков, готовых продавать оружие новому государству."
 SVN_border_fortification:0 "Укрепление границ"
 SVN_border_fortification_desc:0 "Укрепить дороги, мосты и перевалы, которые решают, кто может войти в страну."
 SVN_professional_army:0 "Профессиональная армия"
 SVN_professional_army_desc:0 "Заменить импровизированные формирования обученными, оплачиваемыми и снабжаемыми бригадами."
 SVN_seek_recognition:0 "Поиск признания"
 SVN_seek_recognition_desc:0 "Добиться признания у соседей и в столицах, от которых это зависит."
 SVN_write_constitution:0 "Новая конституция"
 SVN_write_constitution_desc:0 "Определить институты, права меньшинств и источник власти."
 SVN_diplomatic_missions:0 "Дипломатические миссии"
 SVN_diplomatic_missions_desc:0 "Открыть представительства за рубежом и отстаивать интересы нового государства лично."
 SVN_national_legitimacy:0 "Национальная легитимность"
 SVN_national_legitimacy_desc:0 "Подкрепить новый порядок выборами, публичными церемониями и видимыми результатами."
 SVN_define_national_territory:0 "Определение национальной территории"
 SVN_define_national_territory_desc:0 "Закрепить в законе, что государство считает своей землёй. Вся его основная территория подтверждается как национальная."
 SVN_secure_the_economy:0 "Защита экономики"
 SVN_secure_the_economy_desc:0 "Сохранить работу банков, выплату зарплат и наполненность магазинов."
 SVN_repair_infrastructure:0 "Восстановление инфраструктуры"
 SVN_repair_infrastructure_desc:0 "Починить дороги, железные дороги и линии электропередач, которые прежняя федеральная система оставила недоделанными."
 SVN_revive_industry:0 "Возрождение промышленности"
 SVN_revive_industry_desc:0 "Заново связать заводы с сырьём и покупателями, которые раньше находились в других республиках."
 SVN_open_trade_routes:0 "Открытие торговых путей"
 SVN_open_trade_routes_desc:0 "Заменить федеральный рынок договорами, работающими через новые границы."
 SVN_national_economy:0 "Национальная экономика"
 SVN_national_economy_desc:0 "Построить экономику, опирающуюся на собственную валюту, собственный бюджет и собственные планы."
 SVN_u1:0 "Альпийская оборонительная линия"
 SVN_u1_desc:0 "Использовать горные перевалы и короткую, хорошо знакомую границу, чтобы сделать любое вмешательство дорогим."
 SVN_u2:0 "Ворота в Центральную Европу"
 SVN_u2_desc:0 "Привязать экономику к австрийскому и итальянскому рынкам и адриатическим портам."
 SVN_u3:0 "Возвращение в Европу"
 SVN_u3_desc:0 "Представить Словению как устоявшееся демократическое государство, которому место в европейских институтах."
 SVN_u4:0 "Малое государство, сумевшее устоять"
 SVN_u4_desc:0 "Оборона, экономика и дипломатия теперь поддерживают друг друга. Государство невелико, но держится."
 SVN_statehood_spirit:0 "Дух государственности"
 SVN_statehood_spirit_desc:0 "Первые месяцы работы собственных институтов дают стране ощущение цели."
 SVN_territorial_defence_spirit:0 "Территориальная оборона"
 SVN_territorial_defence_spirit_desc:0 "Резервные части в каждой общине затрудняют вторжение в страну."
 SVN_national_economy_spirit:0 "Национальная экономика"
 SVN_national_economy_spirit_desc:0 "Экономика теперь работает на собственном бюджете и по собственным планам."
 SVN_national_resolve:0 "Национальная решимость"
