l_english:
 YUG_organize_the_federation:0 "Organize the Federal Government"
 YUG_organize_the_federation_desc:0 "Settle the working order of the federal cabinet, the Presidency and the republican delegations before the crisis forces the issue."
 YUG_strengthen_federal_institutions:0 "Strengthen Federal Institutions"
 YUG_strengthen_federal_institutions_desc:0 "Give federal bodies the staff and the budget to carry out their decisions."
 YUG_modernize_the_economy:0 "Modernize the Economy"
 YUG_modernize_the_economy_desc:0 "Open the debate on ownership, enterprise management and the role of the market."
 YUG_reform_the_army:0 "Reform the Army"
 YUG_reform_the_army_desc:0 "Review the structure of the Yugoslav People's Army and its relation to the republics."
 YUG_defend_the_adriatic:0 "Defend the Adriatic"
 YUG_defend_the_adriatic_desc:0 "Secure the coast, the ports and the coastal roads that bind the federation together."
 YUG_yugoslav_future:0 "The Yugoslav Future"
 YUG_yugoslav_future_desc:0 "The groundwork is laid. The question now is which Yugoslavia the republics will accept."
 YUG_rising_nationalism:0 "Rising Nationalism"
 YUG_rising_nationalism_desc:0 "National movements gain ground in every republic and the common language of politics begins to fail."
 YUG_crisis_of_federal_trust:0 "Crisis of Federal Trust"
 YUG_crisis_of_federal_trust_desc:0 "Republics stop believing that federal bodies speak for them. Every decision is read as a favour to someone else."
 YUG_emergency_republic_talks:0 "Emergency Talks with the Republics"
 YUG_emergency_republic_talks_desc:0 "Call the republican leaders to a closed session. Nothing is agreed, but everyone is in the room."
 YUG_crackdown_on_separatism:0 "Crackdown on Separatism"
 YUG_crackdown_on_separatism_desc:0 "Treat separatist organisations as a threat to the constitutional order and act accordingly."
 YUG_constitutional_compromise_attempt:0 "Constitutional Compromise Attempt"
 YUG_constitutional_compromise_attempt_desc:0 "Put a package on the table: wider republican powers, a guaranteed federal core, and a timetable for both."
 YUG_allow_self_determination:0 "Allow Self-Determination"
 YUG_allow_self_determination_desc:0 "Accept in principle that each republic may decide its own future, and manage what follows."
 YUG_federal_collapse:0 "Federal Collapse"
 YUG_federal_collapse_desc:0 "The federation can no longer hold its republics together by consent. What remains is to decide how it ends."
 YUG_republic_leaders_council:0 "Permanent Council of Republican Leaders"
 YUG_republic_leaders_council_desc:0 "A standing body where presidents of the republics meet monthly, with minutes."
 YUG_administrative_reform:0 "Administrative Reform"
 YUG_administrative_reform_desc:0 "Cut overlapping federal departments and make civil service careers depend on results."
 YUG_review_competences:0 "Review the Division of Powers"
 YUG_review_competences_desc:0 "Go through every federal competence and ask whether the republics could carry it better."
 YUG_provinces_settlement:0 "Settlement with the Autonomous Provinces"
 YUG_provinces_settlement_desc:0 "Clarify the position of Vojvodina and Kosovo inside the federation and within Serbia."
 YUG_new_federal_treaty:0 "A New Federal Treaty"
 YUG_new_federal_treaty_desc:0 "Replace the patchwork of amendments with one treaty all republics sign."
 YUG_constitutional_settlement:0 "Constitutional Settlement"
 YUG_constitutional_settlement_desc:0 "Ratify the reformed constitution and close the crisis by agreement."
 YUG_currency_stabilization:0 "Stabilize the Currency"
 YUG_currency_stabilization_desc:0 "Peg the dinar to a hard anchor and defend it with reserves."
 YUG_fight_inflation:0 "Fight Inflation"
 YUG_fight_inflation_desc:0 "Wage restraint, a hard budget limit and a price watch. Unpopular, and it works."
 YUG_banking_reform:0 "Banking System Reform"
 YUG_banking_reform_desc:0 "Separate commercial banks from republican patronage and set common reserve rules."
 YUG_industrial_stimulus:0 "Industrial Stimulus"
 YUG_industrial_stimulus_desc:0 "Credit lines for machine building, steel and vehicles in the main industrial districts."
 YUG_energy_modernization:0 "Energy Modernization"
 YUG_energy_modernization_desc:0 "Rebuild the power grid and link republican systems into one network."
 YUG_transport_programme:0 "Rail and Road Programme"
 YUG_transport_programme_desc:0 "Finish the motorway and modernize the main railway lines between republics."
 YUG_agriculture_modernization:0 "Modernize Agriculture"
 YUG_agriculture_modernization_desc:0 "Cooperatives, machinery and storage so the harvest stops depending on the weather alone."
 YUG_adriatic_tourism:0 "Adriatic Tourism"
 YUG_adriatic_tourism_desc:0 "Hotels, harbours and a unified marketing board for the coast."
 YUG_economic_equalization:0 "Economic Equalization Programme"
 YUG_economic_equalization_desc:0 "A federal fund for the poorer republics. The richer ones notice the bill."
 YUG_export_led_strategy:0 "Export-Led Strategy"
 YUG_export_led_strategy_desc:0 "Bet on foreign markets: faster growth, more exposure to outside shocks."
 YUG_internal_market_strategy:0 "Internal Market Strategy"
 YUG_internal_market_strategy_desc:0 "Bind republican economies together through a common market and shared supply chains."
 YUG_reform_the_constitution:0 "Open the Constitutional Question"
 YUG_reform_the_constitution_desc:0 "Admit that the 1974 constitution needs rewriting and set up the process."
 YUG_political_liberalization:0 "Political Liberalization"
 YUG_political_liberalization_desc:0 "Loosen censorship, allow independent associations and open parliamentary debate."
 YUG_electoral_law_review:0 "Review the Electoral Law"
 YUG_electoral_law_review_desc:0 "Draft rules for competitive elections that every republic can accept."
 YUG_judicial_reform:0 "Judicial Reform"
 YUG_judicial_reform_desc:0 "Courts that are protected from party instructions and republican pressure."
 YUG_civil_liberties:0 "Protect Civil Liberties"
 YUG_civil_liberties_desc:0 "Freedom of assembly, press and association written into federal law."
 YUG_competitive_elections:0 "Competitive Elections"
 YUG_competitive_elections_desc:0 "Hold multi-party elections for federal and republican assemblies."
 YUG_civilian_control_of_army:0 "Civilian Control of the Army"
 YUG_civilian_control_of_army_desc:0 "Put the army under parliamentary budget oversight. The officer corps takes note."
 YUG_democratic_social_compact:0 "A New Democratic Compact"
 YUG_democratic_social_compact_desc:0 "A treaty between elected governments in place of a treaty between party leaderships."
 YUG_division_of_powers:0 "Divide Powers"
 YUG_division_of_powers_desc:0 "A written list of what belongs to the federation and what to the republics."
 YUG_budget_autonomy_talks:0 "Budget Autonomy Talks"
 YUG_budget_autonomy_talks_desc:0 "Negotiate how much of each republic's revenue stays at home."
 YUG_joint_defence_treaty:0 "Joint Defence Treaty"
 YUG_joint_defence_treaty_desc:0 "Republican forces and the federal army commit to a common defence plan."
 YUG_confederal_model:0 "Move to a Confederal Model"
 YUG_confederal_model_desc:0 "Sovereign republics delegate chosen powers to a common centre."
 YUG_peaceful_exit_terms:0 "Terms of Peaceful Exit"
 YUG_peaceful_exit_terms_desc:0 "Write down how a republic may leave: referendum, debts, army property, citizenship."
 YUG_economic_defence_union:0 "Economic and Defence Union"
 YUG_economic_defence_union_desc:0 "Keep one market and one defence even if the republics are sovereign."
 YUG_security_forces_reform:0 "Reform the Security Forces"
 YUG_security_forces_reform_desc:0 "Merge overlapping federal police and security services under one command."
 YUG_disarm_illegal_formations:0 "Disarm Illegal Formations"
 YUG_disarm_illegal_formations_desc:0 "Seize weapons from unauthorized local armed groups before they organize."
 YUG_centralize_defence_planning:0 "Centralize Defence Planning"
 YUG_centralize_defence_planning_desc:0 "All defence plans, depots and call-up lists answer to one general staff."
 YUG_federal_administrative_control:0 "Federal Administrative Control"
 YUG_federal_administrative_control_desc:0 "Appoint federal commissioners to supervise republican administrations."
 YUG_unity_campaign:0 "Campaign for Unity"
 YUG_unity_campaign_desc:0 "A political campaign for the common state, from schools to factory floors."
 YUG_federal_army_rearmament:0 "Rearm the Federal Army"
 YUG_federal_army_rearmament_desc:0 "New equipment for the units the federation trusts most."
 YUG_final_settlement_attempt:0 "Attempt a Final Settlement"
 YUG_final_settlement_attempt_desc:0 "Use every federal lever at once to end the crisis on the centre's terms."
 YUG_reform_socialist_institutions:0 "Reform Socialist Institutions"
 YUG_reform_socialist_institutions_desc:0 "Renew party and state bodies and return them to the programme of self-management."
 YUG_workers_organizations:0 "Rebuild Workers' Organizations"
 YUG_workers_organizations_desc:0 "Elected works councils with a real say in wages and investment."
 YUG_state_enterprise_modernization:0 "Modernize State Enterprises"
 YUG_state_enterprise_modernization_desc:0 "Replace worn-out plant in the state sector before closing it down."
 YUG_social_security:0 "Renew Social Security"
 YUG_social_security_desc:0 "Pensions, health and housing funded from one federal formula."
 YUG_employment_programme:0 "Employment Programme"
 YUG_employment_programme_desc:0 "Public works and retraining for regions that lose factories."
 YUG_workers_state_compact:0 "Compact between Workers and State"
 YUG_workers_state_compact_desc:0 "A new settlement between workers' organizations, enterprises and the state."
 YUG_modernize_ground_forces:0 "Modernize Ground Forces"
 YUG_modernize_ground_forces_desc:0 "A modernization plan for the infantry core of the army."
 YUG_armoured_units:0 "Develop Armoured Units"
 YUG_armoured_units_desc:0 "Concentrate tanks in a few well-supplied formations."
 YUG_artillery_modernization:0 "Modernize Artillery"
 YUG_artillery_modernization_desc:0 "Fire-control, towing and stocks of shells."
 YUG_reservist_training:0 "Train the Reservists"
 YUG_reservist_training_desc:0 "Regular refresher courses for the mobilization pool."
 YUG_territorial_defence_coordination:0 "Coordinate Territorial Defence"
 YUG_territorial_defence_coordination_desc:0 "Agree how republican territorial defence fits the federal plan. Each republic keeps its own stores."
 YUG_military_industry_programme:0 "Military Industry Programme"
 YUG_military_industry_programme_desc:0 "Expand the arsenal districts and secure the supply of components."
 YUG_civilian_oversight_of_army:0 "Civilian Oversight of the Army"
 YUG_civilian_oversight_of_army_desc:0 "Establish a defence committee of delegates with budget powers."
 YUG_crisis_contingency_planning:0 "Contingency Planning for State Crisis"
 YUG_crisis_contingency_planning_desc:0 "Plans for each scenario of the crisis, kept in the general staff safe."
 YGwar.10.t:0 "Cracks in the Federation"
 YGwar.10.d:0 "Republican delegations vote against federal proposals more often, and the press has started to count the votes by republic. Nothing is broken yet, but everyone is watching how the Presidency reacts."
 YGwar.10.a:0 "Call the republican leaders together"
 YGwar.10.b:0 "Treat it as routine politics"
 YGwar.11.t:0 "Crisis of Federal Trust"
 YGwar.11.d:0 "Republics no longer accept federal figures at face value. Budget allocations, army postings and even census numbers are contested."
 YGwar.11.a:0 "Open emergency negotiations"
 YGwar.11.b:0 "Assert federal authority"
 YGwar.12.t:0 "Emergency Federal Conference"
 YGwar.12.d:0 "The cohesion of the federation has fallen below the point where decisions can be taken by consent. The Presidency calls a conference. Three roads are open, and none of them is cheap."
 YGwar.12.a:0 "Seek a confederal compromise"
 YGwar.12.b:0 "Declare emergency rule"
 YGwar.12.c:0 "Prepare for an orderly dissolution"
 YGwar.14.t:0 "The Republics Agree on a Confederal Model"
 YGwar.14.d:0 "The republics accept a confederal draft: sovereign members, a small common centre, one market and a joint defence council. It is less than some wanted and more than others expected."
 YGwar.14.a:0 "Sign the draft"
 YGwar.14.b:0 "Sign, with a guaranteed army budget"
 YGwar.15.t:0 "The Security Forces Close Ranks"
 YGwar.15.d:0 "Commanders of several garrisons have started to take orders only from officers of their own republic. Staff reports describe it as an administrative matter."
 YGwar.15.a:0 "Give them guarantees on pay and rank"
 YGwar.15.b:0 "Rotate the commanders"
 YGwar.16.t:0 "Military Command Defies the Government"
 YGwar.16.d:0 "The General Staff declines to carry out a cabinet order, citing the state of the units. For the first time in decades the army speaks as a political actor."
 YGwar.16.a:0 "Negotiate with the generals"
 YGwar.16.b:0 "Give the army emergency powers"
 YGwar.20.t:0 "Agreement on Orderly Dissolution"
 YGwar.20.d:0 "Slovenia, Croatia and Macedonia are recognised as independent states in a written settlement. Debts, army property and border crossings are divided on paper."
 YGwar.20.a:0 "Sign the settlement"
 YGwar.21.t:0 "Bosnia and Herzegovina Votes"
 YGwar.21.d:0 "Bosnia and Herzegovina must now decide. Its three communities disagree on whether to stay in what is left of the federation or to leave it."
 YGwar.21.a:0 "Allow a negotiated exit of all Bosnia and Herzegovina"
 YGwar.21.b:0 "Insist on guarantees for each community"
 YGwar.22.t:0 "The Rump Federation Reorganizes"
 YGwar.22.d:0 "What remains of the federation is Serbia with its provinces, and Montenegro. Both governments must decide how to organize their union, and what to do with the provinces."
 YGwar.22.a:0 "Keep the union of Serbia and Montenegro with the provinces"
 YGwar.22.b:0 "Let Vojvodina and Kosovo go their own way"
 YGwar.22.c:0 "Let Montenegro leave the union"
 YGwar.30.t:0 "The End of the Federation"
 YGwar.30.d:0 "The republics no longer agree on anything but the date of the last session. The Presidency must decide how the state ends."
 YGwar.30.a:0 "An orderly dissolution by agreement"
 YGwar.30.b:0 "Dissolution without agreement"
 YGwar.30.c:0 "Hold the federation together a little longer"
 YGwar.31.t:0 "Bosnia and Herzegovina Divided"
 YGwar.31.d:0 "With Croatia at war and its Serb districts in revolt, Bosnia and Herzegovina is pulled apart. The three communities form their own administrations."
 YGwar.31.a:0 "The three communities part ways"
 YGwar.40.t:0 "The Final Settlement"
 YGwar.40.d:0 "Federal forces, commissioners and the unity campaign move at the same time. The outcome depends on whether the security forces follow orders."
 YGwar.40.a:0 "Carry out the settlement"
 YGwar.50.t:0 "A Reformed Federation"
 YGwar.50.d:0 "The republics ratify a constitution that all of them helped write. It does not end every dispute, but it gives them a place to settle them."
 YGwar.50.a:0 "Close the crisis by agreement"
 YGwar.51.t:0 "A New Democratic Compact"
 YGwar.51.d:0 "Elected governments sign a compact that gives the federation a smaller but better-defined role."
 YGwar.51.a:0 "Keep a democratic federation"
 YGwar.51.b:0 "Settle on a democratic confederation"
 YGwar.52.t:0 "The Economic and Defence Union"
 YGwar.52.d:0 "Sovereign republics sign a union treaty. One market, one defence council, and a standing right to review membership."
 YGwar.52.a:0 "Ratify the union"
 YGwar.53.t:0 "Compact between Workers and State"
 YGwar.53.d:0 "Workers' organizations, enterprises and the state sign a long-term compact on wages, investment and self-management."
 YGwar.53.a:0 "Sign the compact"
 YGwar.54.t:0 "Results of the Elections"
 YGwar.54.d:0 "The first competitive elections are over. A reformist list and a conservative-compromise coalition both claim the right to form the government."
 YGwar.54.a:0 "The reformist list forms the government"
 YGwar.54.b:0 "A coalition of compromise forms the government"
 YGwar.1.t:0 "Security Forces Unrest"
 YGwar.1.d:0 "Reports reach the Presidency of disorder in local militia units: unpaid wages, contested orders and unauthorised movements."
 YGwar.1.a:0 "Pay arrears and reassure the units"
 YGwar.1.b:0 "Order the units back to barracks"
 YUG_federal_bureaucracy:0 "Federal Bureaucracy"
 YUG_federal_bureaucracy_desc:0 "Overlapping federal departments slow every decision."
 YUG_streamlined_administration:0 "Streamlined Administration"
 YUG_streamlined_administration_desc:0 "Clear lines of responsibility have replaced the old overlap."
 YUG_economic_instability:0 "Economic Instability"
 YUG_economic_instability_desc:0 "Inflation and debt weigh on factories and households."
 YUG_stabilization_programme:0 "Stabilization Programme"
 YUG_stabilization_programme_desc:0 "Hard budget limits have steadied prices, at a cost in output."
 YUG_republican_particularism:0 "Republican Particularism"
 YUG_republican_particularism_desc:0 "Each republic reads federal policy through its own interests."
 YUG_military_leadership_influence:0 "Military Leadership Influence"
 YUG_military_leadership_influence_desc:0 "The army is strong and has opinions about politics."
 YUG_transport_network:0 "Transport Network"
 YUG_transport_network_desc:0 "Roads, rails and ports connect the republics better than politics does."
 YUG_industrial_potential:0 "Industrial Potential"
 YUG_industrial_potential_desc:0 "A broad base of machine building, steel and vehicles."
 YUG_federal_trust_crisis:0 "Crisis of Federal Trust"
 YUG_federal_trust_crisis_desc:0 "Republics doubt that federal bodies are fair. Rebuild trust or reform the federation to lift it."
 YUG_emergency_rule:0 "Emergency Rule"
 YUG_emergency_rule_desc:0 "Decisions are made fast and by few. The republics notice."
 YUG_rail_road_programme:0 "Rail and Road Programme"
 YUG_rail_road_programme_desc:0 "New links make goods and troops move faster."
 YUG_modern_agriculture:0 "Modern Agriculture"
 YUG_modern_agriculture_desc:0 "Cooperatives and storage steady food supply."
 YUG_export_orientation:0 "Export Orientation"
 YUG_export_orientation_desc:0 "Factories work for foreign markets, with the risks that brings."
 YUG_common_market:0 "Common Market"
 YUG_common_market_desc:0 "Shared supply chains bind republican economies together."
 YUG_democratic_institutions:0 "Democratic Institutions"
 YUG_democratic_institutions_desc:0 "Open politics bring stability and slow decisions."
 YUG_joint_defence:0 "Joint Defence"
 YUG_joint_defence_desc:0 "Republican and federal forces share one defence plan."
 YUG_central_defence_planning:0 "Central Defence Planning"
 YUG_central_defence_planning_desc:0 "One general staff controls plans, depots and call-ups."
 YUG_workers_councils:0 "Workers' Councils"
 YUG_workers_councils_desc:0 "Elected councils have a real say in enterprise decisions."
 YUG_trained_reserves:0 "Trained Reserves"
 YUG_trained_reserves_desc:0 "Regular refresher courses keep the mobilization pool ready."
 YUG_territorial_defence_network:0 "Territorial Defence Network"
 YUG_territorial_defence_network_desc:0 "Local stores and plans strengthen defence, and also local loyalties."
 YUG_confederal_bargaining:0 "Confederal Bargaining"
 YUG_confederal_bargaining_desc:0 "Every decision is negotiated between sovereign members."
 YUG_reformed_federation:0 "Reformed Federation"
 YUG_reformed_federation_desc:0 "A constitution all republics helped write."
 YUG_centralized_state:0 "Centralized State"
 YUG_centralized_state_desc:0 "A strong centre, a strong army and little patience for dissent."
 YGwar_militia_category:0 "Security Forces"
 YGwar_federal_category:0 "Federal Government"
 YGwar_federal_category_desc:0 "Routine tools of the federal government."
 YGwar_crisis_category:0 "Federation in Crisis"
 YGwar_crisis_category_desc:0 "Tools for managing the crisis. Available once cohesion has started to fall."
 YGwar_republic_category:0 "Republican Government"
 YGwar_republic_category_desc:0 "Routine tools for republican and regional governments."
 YUG_discipline_militia:0 "Discipline the Militia"
 YUG_discipline_militia_desc:0 "Raise militia loyalty. It may cause some unrest."
 YUG_hold_republic_talks:0 "Hold Talks with the Republics"
 YUG_hold_republic_talks_desc:0 "Raise federation cohesion."
 YUG_federal_economic_programme:0 "Federal Economic Programme"
 YUG_federal_economic_programme_desc:0 "Fund civilian industry while the economy is unstable."
 YUG_constitutional_commission:0 "Constitutional Reform Commission"
 YUG_constitutional_commission_desc:0 "Set up a commission, once. Raises cohesion."
 YUG_review_budget_agreements:0 "Review Budget Agreements"
 YUG_review_budget_agreements_desc:0 "Raise cohesion at some cost to the security forces."
 YUG_army_development_programme:0 "Army Development Programme"
 YUG_army_development_programme_desc:0 "Build arms factories and raise security-force loyalty."
 YUG_defuse_tensions:0 "Defuse Tensions"
 YUG_defuse_tensions_desc:0 "Raise cohesion."
 YUG_summon_emergency_talks:0 "Summon Emergency Talks"
 YUG_summon_emergency_talks_desc:0 "Raise cohesion substantially. Needs a serious crisis."
 YUG_rebuild_trust:0 "Rebuild Trust"
 YUG_rebuild_trust_desc:0 "Raise loyalty and cohesion while the trust crisis lasts."
 YUG_prepare_transitional_administration:0 "Prepare Transitional Administration"
 YUG_prepare_transitional_administration_desc:0 "Prepare for an orderly end, once. Makes dissolution cheaper and safer."
 YGwar_consolidate_institutions:0 "Consolidate Institutions"
 YGwar_consolidate_institutions_desc:0 "Raise stability. Limited number of uses."
 YGwar_regional_investment:0 "Regional Investment"
 YGwar_regional_investment_desc:0 "Build civilian industry. Limited number of uses."
 YGwar_territorial_defence_drive:0 "Territorial Defence Drive"
 YGwar_territorial_defence_drive_desc:0 "Raise war support at some cost to stability. Limited number of uses."
 YUG_dragan_vukic:0 "Dragan Vukić"
 YUG_stevan_jovanov:0 "Stevan Jovanov"
 YUG_milos_radic:0 "Miloš Radić"
 YUG_ana_kovac:0 "Ana Kovač"
 YUG_petar_lazic:0 "Petar Lazić"
 YUG_mirko_stankovic:0 "Mirko Stanković"
 YUG_jelena_ilic:0 "Jelena Ilić"
 YUG_YGwar_leader:0 "Interim Leader of Yugoslavia"
 SVN_YGwar_leader:0 "Interim Leader of Slovenia"
 CRO_YGwar_leader:0 "Interim Leader of Croatia"
 BOS_YGwar_leader:0 "Interim Leader of Bosnia and Herzegovina"
 SER_YGwar_leader:0 "Interim Leader of Serbia"
 MNT_YGwar_leader:0 "Interim Leader of Montenegro"
 MAC_YGwar_leader:0 "Interim Leader of Macedonia"
 VOJ_YGwar_leader:0 "Interim Leader of Vojvodina"
 KOS_YGwar_leader:0 "Interim Leader of Kosovo"
 RSB_YGwar_leader:0 "Interim Leader of Republika Srpska"
 RSK_YGwar_leader:0 "Interim Leader of Republika Srpska Krajina"
 HRZ_YGwar_leader:0 "Interim Leader of Herceg-Bosna"
