l_english:
 SVN_consolidate_statehood:0 "Consolidate Statehood"
 SVN_consolidate_statehood_desc:0 "Set up the working institutions of the new state: a government, a budget, a police and a postal service."
 SVN_build_defence_forces:0 "Build Defence Forces"
 SVN_build_defence_forces_desc:0 "Turn local units and volunteers into a single chain of command."
 SVN_territorial_defence:0 "Territorial Defence"
 SVN_territorial_defence_desc:0 "Organise reserve units in every municipality so the state is not defenceless on the first day."
 SVN_arms_procurement:0 "Arms Procurement"
 SVN_arms_procurement_desc:0 "Take over local depots and look for suppliers willing to sell to a new state."
 SVN_border_fortification:0 "Border Fortification"
 SVN_border_fortification_desc:0 "Fortify the roads, bridges and passes that decide who can enter the country."
 SVN_professional_army:0 "A Professional Army"
 SVN_professional_army_desc:0 "Replace improvised formations with trained, paid and properly supplied brigades."
 SVN_seek_recognition:0 "Seek Recognition"
 SVN_seek_recognition_desc:0 "Win acceptance among neighbours and in the capitals that matter."
 SVN_write_constitution:0 "Write a Constitution"
 SVN_write_constitution_desc:0 "Define the institutions, the rights of minorities and the source of authority."
 SVN_diplomatic_missions:0 "Diplomatic Missions"
 SVN_diplomatic_missions_desc:0 "Open missions abroad and make the case for the new state in person."
 SVN_national_legitimacy:0 "National Legitimacy"
 SVN_national_legitimacy_desc:0 "Back the new order with elections, public ceremonies and visible results."
 SVN_define_national_territory:0 "Define the National Territory"
 SVN_define_national_territory_desc:0 "Settle in law what the state considers its own land. All its core territory is confirmed as national."
 SVN_secure_the_economy:0 "Secure the Economy"
 SVN_secure_the_economy_desc:0 "Keep the banks open, the wages paid and the shops stocked."
 SVN_repair_infrastructure:0 "Repair Infrastructure"
 SVN_repair_infrastructure_desc:0 "Restore the roads, rails and power lines that the old federal system left half-finished."
 SVN_revive_industry:0 "Revive Industry"
 SVN_revive_industry_desc:0 "Reconnect factories to raw materials and customers that used to sit in other republics."
 SVN_open_trade_routes:0 "Open Trade Routes"
 SVN_open_trade_routes_desc:0 "Replace the federal market with agreements that work across new borders."
 SVN_national_economy:0 "A National Economy"
 SVN_national_economy_desc:0 "Build an economy that stands on its own currency, its own budget and its own plans."
 SVN_u1:0 "Alpine Defence Line"
 SVN_u1_desc:0 "Use the mountain passes and the short, well-known border to make any intervention costly."
 SVN_u2:0 "Gateway to Central Europe"
 SVN_u2_desc:0 "Tie the economy to Austrian and Italian markets and to the Adriatic ports."
 SVN_u3:0 "Return to Europe"
 SVN_u3_desc:0 "Present Slovenia as a settled, democratic state that belongs in the European institutions."
 SVN_u4:0 "A Small State, Secured"
 SVN_u4_desc:0 "Defence, economy and diplomacy now support each other. The state is small but it holds."
